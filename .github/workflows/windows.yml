name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Rust lint
        run: cargo clippy --all-targets
      - name: Build
        run: cargo build --release
      - name: Search benchmark
        run: cargo test --release --lib benchmark_search -- --ignored --nocapture
      - name: Test command line
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "fsearch-smoke"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Set-Content -Path (Join-Path $root "fsearch-unique-alpha.txt") -Value "test"
          $first = & .\target\release\fsearch.exe "fsearch-unique-alpha" --root $root --reindex 2>$null
          if ($LASTEXITCODE -ne 0 -or $first.Count -ne 1) { throw "Initial search failed" }
          Set-Content -Path (Join-Path $root "fsearch-unique-beta.txt") -Value "test"
          $old = & .\target\release\fsearch.exe "fsearch-unique-beta" --root $root 2>$null
          if ($LASTEXITCODE -ne 0 -or $null -ne $old) { throw "Saved index wasn't reused" }
          $new = & .\target\release\fsearch.exe "fsearch-unique-beta" --root $root --reindex 2>$null
          if ($LASTEXITCODE -ne 0 -or @($new).Count -ne 1) { throw "Refresh failed" }
